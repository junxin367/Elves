[workspace]
resolver = "2"
members = [
  "crates/elves-assets",
  "crates/elves-core",
  "crates/elves-data",
  "crates/elves-harness",
  "apps/elves/src-tauri",
  "apps/elves-manager/src-tauri",
]

[workspace.package]
# 用户要求桌面版本统一为 1.0.0；npm 与 Tauri 元数据同步，Android 保持独立版本。
version = "1.0.0"
edition = "2024"
license = "MIT"
# 用户要求 GitHub 仓库迁移至 Elves，crate 和产品产物仍沿用 Elves 命名。
repository = "https://github.com/junxin367/Elves"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
directories = "6"
flate2 = "1.1"
fs2 = "0.4"
futures-util = "0.3"
if-addrs = { version = "0.15", features = ["link-local"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
toml_edit = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
winresource = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 正式安装包仍保持 opt-level=3；开启增量并行代码生成，缩短本机和持续集成中的重复 release 编译。
# codegen-units 从 Cargo 默认值提高到 64，会略微减少跨单元优化机会，但不改变 release 的优化级别。
[profile.release]
incremental = true
codegen-units = 64

# 用户要求缩短日常编译等待：release-fast 进一步降低自身 crate 的优化等级，正式安装包仍使用 release。
# 不使用 package."*"，否则会覆盖 build-override 并让第三方构建脚本与过程宏也按高优化重新编译。
[profile.release-fast]
inherits = "release"
incremental = true
codegen-units = 256

[profile.release-fast.package.elves-assets]
opt-level = 1

[profile.release-fast.package.elves-core]
opt-level = 1

[profile.release-fast.package.elves-data]
opt-level = 1

[profile.release-fast.package.elves-harness]
opt-level = 1

[profile.release-fast.package.elves]
opt-level = 1

[profile.release-fast.package.elves-manager]
opt-level = 1
