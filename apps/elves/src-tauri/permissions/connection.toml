[[permission]]
identifier = "remote-connection"
description = "Elves 内置启动页可读取状态并重试本机 Harness。"
commands.allow = ["client_startup_state", "client_retry_startup"]

[[permission]]
identifier = "remote-desktop-authentication"
description = "仅原生绑定的本机会话页可恢复自身授权，不可指定服务地址、读取凭据或变更远程权限。"
commands.allow = ["client_recover_authentication"]

[[permission]]
identifier = "remote-appearance"
description = "当前服务仅可同步经过校验的原生应用顶栏 RGB 配色，不可操作窗口或修改连接设置。"
commands.allow = ["client_titlebar_theme"]

[[permission]]
identifier = "remote-taskbar-badge"
description = "当前服务的主窗口仅可同步未读会话数字角标，不可操作窗口或修改连接设置。"
commands.allow = ["client_unread_badge"]

[[permission]]
identifier = "remote-resource-cache"
description = "当前服务只可查看/检查公开网页资源缓存并告知前台忙碌状态，不可改变服务地址或读取设备凭据。"
commands.allow = ["client_cache_status", "client_cache_refresh", "client_cache_activity"]

[[permission]]
identifier = "remote-session-window"
description = "当前服务可打开同来源的会话或文件预览窗口，不可指定任意地址、读取本机文件或控制其他窗口。"
commands.allow = ["client_open_session_window"]

[[permission]]
identifier = "remote-local-inputs"
description = "当前前台会话可读取系统选择器选中的文件/文件夹或文件剪贴板，不接受网页提供本机路径。"
commands.allow = ["client_choose_inputs", "client_paste_inputs"]

[[permission]]
identifier = "remote-project-navigation"
description = "仅本机主工作区可读取和确认原生菜单已登记的项目 ID，不能提交文件路径、打开选择器或登记项目。"
commands.allow = ["client_project_navigation"]
