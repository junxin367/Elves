name: PR build artifacts

on:
  pull_request:
  workflow_dispatch:

env:
  ARTIFACT_VERSION: 0.0.0-${{ github.run_number }}

permissions:
  contents: read

jobs:
  android-changes:
    name: Detect Android changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Detect Android build inputs
        id: changes
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("changed", "true");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const relevant = (path) =>
              (path.startsWith("apps/elves-android/") &&
                !/(?:^|\/)(?:build|\.gradle|\.idea)\//.test(path) &&
                !path.endsWith("/local.properties")) ||
              path.startsWith("assets/harness/") ||
              /^scripts\/[^/]*android[^/]*\.ps1$/.test(path) ||
              path === "build.ps1" ||
              path === ".github/workflows/android-apk.yml" ||
              path === ".github/workflows/pr-build.yml";
            core.setOutput("changed", String(files.some(file =>
              relevant(file.filename) || (file.previous_filename && relevant(file.previous_filename)))));

  android-debug:
    name: Android debug APK and lint
    needs: android-changes
    if: ${{ needs.android-changes.outputs.changed == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build debug APK and lint without signing secrets
        shell: pwsh
        run: .\scripts\build-android.ps1 -Configuration Debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: elves-android-pr-debug
          path: dist/android/Elves-*-android-debug.apk
          if-no-files-found: error

  windows-artifacts:
    name: Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/elves-management
        run: npm ci

      - name: TypeScript check
        working-directory: apps/elves-management
        run: npm run check

      - name: Build frontend
        working-directory: apps/elves-management
        run: npm run vite:build

      - name: Rust tests
        run: |
          cargo test --workspace --exclude elves-harness

      - name: Harness 集成测试（串行）
        # 多个测试使用不同密钥，共享进程内单项 KDF 缓存；串行避免缓存抖动耗尽临时授权时间。
        run: |
          cargo test -p elves-harness --lib -- --test-threads=1

      - name: Harness 回归与证据校验测试
        run: node --test scripts/harness-e2e-evidence.test.mjs scripts/harness-e2e-environment.test.mjs scripts/harness-e2e-receipt-driver.test.mjs scripts/harness-ui-state.test.mjs scripts/workspace-tabs.test.mjs scripts/windows-remote-titlebar.test.mjs scripts/windows-remote-cache.test.mjs

      - name: Build release binaries
        # 用户要求统一客户端入口，安装包仅交付内置 Harness 的 Elves 客户端。
        run: cargo build --release -p elves --bin elves

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/elves.exe dist/windows/app/
          node scripts/verify-tool-runtime.mjs . --embedded target/release/elves.exe
          node scripts/verify-windows-build-inputs.mjs . target/release

      - name: Stage portable Elves client
        shell: pwsh
        run: .\scripts\build-windows-client.ps1 -Version "${{ env.ARTIFACT_VERSION }}" -Profile release -SkipBuild

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ env.ARTIFACT_VERSION }}"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" Elves.nsi
          Pop-Location

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v6
        with:
          name: elves-windows-binaries
          path: dist/windows/app/*
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: elves-windows-installer
          path: dist/windows/*-windows-x64-setup.exe
          if-no-files-found: error

      - name: Upload portable Elves client
        uses: actions/upload-artifact@v6
        with:
          name: elves-windows-client
          path: dist/windows/Elves-*-windows-x64.exe
          if-no-files-found: error
