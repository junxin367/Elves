name: Release assets
run-name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
      - "V*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example 0.1.0-alpha.1 or v0.1.0"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  ensure-release:
    name: Ensure GitHub Release
    if: ${{ !startsWith(github.event.release.tag_name || inputs.tag || github.ref_name, 'android-v') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release when missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_state_args=()
          if [[ "$TAG" =~ ^[vV]?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            release_state_args+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release already exists; preserving maintained notes: $TAG"
            gh release edit "$TAG" --repo "$REPO" --title "$TAG" "${release_state_args[@]}"
          else
            node scripts/generate-release-notes.mjs "$TAG" "$REPO" > release-notes.md
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA" "${release_state_args[@]}"
          fi

  windows-installer:
    runs-on: windows-latest
    needs: ensure-release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.ensure-release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/codex-elves-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-elves-manager
        run: npm run check && npm run vite:build

      - name: Build binaries
        # 用户要求统一客户端入口，安装包不再生成独立管理器、launcher 或任务看板。
        run: cargo build --release -p codex-elves-remote --bin codex-elves-remote

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/codex-elves-remote.exe dist/windows/app/
          node scripts/verify-tool-runtime.mjs . --embedded target/release/codex-elves-remote.exe
          node scripts/verify-windows-build-inputs.mjs . target/release

      - name: Stage standalone Windows remote client
        shell: pwsh
        run: |
          $version = "${{ needs.ensure-release.outputs.tag }}".TrimStart("v", "V")
          .\scripts\build-windows-remote.ps1 -Version $version -Profile release -SkipBuild

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ needs.ensure-release.outputs.tag }}".TrimStart("v", "V")
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexElves.nsi
          Pop-Location

      - name: Upload Windows installer and remote client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath dist/windows -Filter *.exe
          if (-not $files) {
            throw "No Windows executables found in dist/windows"
          }
          gh release upload $env:TAG @($files.FullName) --clobber --repo $env:REPO

  latest-json:
    name: Upload static latest.json
    runs-on: ubuntu-latest
    needs:
      - ensure-release
      - windows-installer
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            url: release.url || `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"
